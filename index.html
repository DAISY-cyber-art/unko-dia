<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="運行ダイヤ">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='36' fill='%231F3A5F'/%3E%3Crect x='30' y='50' width='60' height='30' rx='4' fill='%23FF99FF'/%3E%3Crect x='96' y='50' width='54' height='30' rx='4' fill='%23B7DEE8'/%3E%3Crect x='44' y='100' width='70' height='30' rx='4' fill='%23FFC000'/%3E%3Crect x='120' y='100' width='30' height='30' rx='4' fill='%2392D050'/%3E%3C/svg%3E">
<title>運行ダイヤ編集ボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#FAFAF7; --chrome:#EDF0F1; --chrome2:#E2E7E9; --ink:#22313A; --ink-soft:#5B6A72;
  --line:#DCE0E2; --line-strong:#A4AEB3; --ui:#1F3A5F; --ui-ink:#FFFFFF; --warn:#C8102E;
  --flight:#2F6FB3; --ship:#11817A; --focus:#F2A900; --panel:#FFFFFF;
  --block-ink:#1B1B1B;
  font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1B2125; --chrome:#232A2F; --chrome2:#2B3338; --ink:#E3E8EA; --ink-soft:#9AA7AE;
    --line:#30393F; --line-strong:#56636A; --ui:#8DB4E2; --ui-ink:#10202F; --warn:#FF5A6E;
    --flight:#7DB3EC; --ship:#5CCFC5; --panel:#20272B;
  }
}
:root[data-theme="dark"]{
  --paper:#1B2125; --chrome:#232A2F; --chrome2:#2B3338; --ink:#E3E8EA; --ink-soft:#9AA7AE;
  --line:#30393F; --line-strong:#56636A; --ui:#8DB4E2; --ui-ink:#10202F; --warn:#FF5A6E;
  --flight:#7DB3EC; --ship:#5CCFC5; --panel:#20272B;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--chrome);color:var(--ink);font-size:14px;line-height:1.5;display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
@media (pointer:coarse){
  .btn{padding:8px 12px;font-size:14px}
  .run .grip{width:18px}
  .run .grip::after{right:5px}
  .fld input,.fld select,.stoprow input{padding:7px 8px;font-size:16px}
  .stoprow{grid-template-columns:22px 1fr 70px 34px}
  .menu button{padding:10px 10px;font-size:15px}
}
.nudge{display:flex;gap:4px;margin:-2px 0 8px 84px;flex-wrap:wrap}
.nudge .btn{padding:3px 8px;font-size:12px}
:focus-visible{outline:3px solid var(--focus);outline-offset:1px}

/* header */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 14px;background:var(--chrome);border-bottom:1px solid var(--line-strong)}
.top h1{font-size:17px;margin:0 8px 0 0;letter-spacing:.04em;white-space:nowrap}
.grp{display:flex;align-items:center;gap:4px}
.sep{width:1px;height:24px;background:var(--line-strong);margin:0 4px}
.btn{border:1px solid var(--line-strong);background:var(--panel);border-radius:6px;padding:5px 10px;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--ui)}
.btn.primary{background:var(--ui);color:var(--ui-ink);border-color:var(--ui)}
.btn.on{background:var(--ui);color:var(--ui-ink);border-color:var(--ui)}
.btn:disabled{opacity:.4;cursor:default}
select.plan{border:1px solid var(--line-strong);border-radius:6px;padding:5px 8px;background:var(--panel);max-width:220px}
.status{font-size:12px;color:var(--ink-soft);margin-left:auto;white-space:nowrap}
.zoom{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft)}
.zoom input{width:90px}

/* layout */
.main{flex:1;display:flex;min-height:0}
.boardwrap{flex:1;overflow:auto;background:var(--paper);position:relative}
.board{position:relative;user-select:none;-webkit-user-select:none}
.side[hidden]{display:none}
.side{width:340px;flex:none;background:var(--panel);border-left:1px solid var(--line-strong);overflow-y:auto;padding:14px 16px 40px}
@media (max-width:900px){
  .main{flex-direction:column}
  .side{width:auto;height:42%;border-left:0;border-top:1px solid var(--line-strong)}
}

/* ruler & rows */
.ruler{position:sticky;top:0;z-index:6;display:flex;height:30px;background:var(--paper);border-bottom:1px solid var(--line-strong)}
.corner{position:sticky;left:0;z-index:7;background:var(--paper);border-right:1px solid var(--line-strong);font-size:11px;color:var(--ink-soft);display:flex;align-items:flex-end;padding:0 8px 3px}
.ticks{position:relative}
.tick{position:absolute;bottom:3px;transform:translateX(-50%);font-size:13px;font-weight:700}
.tick.half{font-size:10px;font-weight:400;color:var(--ink-soft)}
.row{display:flex;border-bottom:1px solid var(--line-strong)}
.lab{position:sticky;left:0;z-index:5;background:var(--chrome);border-right:1px solid var(--line-strong);padding:8px 8px;display:flex;flex-direction:column;justify-content:center}
.lab .nm{font-size:16px;font-weight:700;letter-spacing:.05em}
.lab .tot{font-size:11px;color:var(--ink-soft);line-height:1.45}
.track{position:relative}
.grid{position:absolute;inset:0;pointer-events:none}
.band{position:absolute;top:0;bottom:0;pointer-events:none;opacity:.10;border-right:1.5px solid}
.band.flight{background:var(--flight);border-color:var(--flight)}
.band.ship{background:var(--ship);border-color:var(--ship)}
.evlane .band{opacity:.06}
.evlane .lab{background:var(--chrome2)}
.evbar{position:absolute;height:18px;border-radius:9px;font-size:11px;line-height:18px;padding:0 6px;white-space:nowrap;color:#fff;overflow:visible}
.evbar.flight{background:var(--flight)}
.evbar.ship{background:var(--ship)}
.evbar span{position:absolute;left:calc(100% + 4px);top:0;color:var(--ink);font-weight:700}

/* run blocks */
.run{position:absolute;z-index:1;top:9px;border:1.5px solid #3c3c3c;border-radius:3px;background:var(--c);color:var(--block-ink);cursor:grab;overflow:hidden;touch-action:none}
.run:hover{box-shadow:0 0 0 2px rgba(31,58,95,.35)}
.run.sel{box-shadow:0 0 0 3px var(--focus);z-index:3}
.run.clash{border-color:var(--warn);background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(200,16,46,.25) 6px 9px)}
.run.dragging{cursor:grabbing;opacity:.85;z-index:4}
.run .mins{position:relative;height:15px;border-bottom:1.5px dashed #3c3c3c;font-size:11px;font-weight:700;line-height:15px}
.run .mins i,.run .stp i{position:absolute;font-style:normal;white-space:nowrap}
.run .stp{position:relative;height:44px;font-size:12px}
.run .stp i{top:2px;line-height:13px;text-align:center}
.run .note{position:absolute;left:6px;right:6px;top:12px;font-size:12px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.run .foot{display:flex;justify-content:space-between;align-items:baseline;gap:4px;border-top:1.5px solid #3c3c3c;padding:0 4px;height:21px;font-size:11px;background:rgba(255,255,255,.55);white-space:nowrap;overflow:hidden}
.run .foot b{font-size:12px}
.run .grip{position:absolute;right:0;top:0;bottom:0;width:8px;cursor:ew-resize}
.run .grip::after{content:"";position:absolute;right:2px;top:50%;width:3px;height:18px;margin-top:-9px;border-left:1px solid #555;border-right:1px solid #555}
.run.narrow .stp i,.run.narrow .foot span{display:none}
.run.narrow .foot{justify-content:center;padding:0}
.run.narrow .foot b{font-size:10px;writing-mode:horizontal-tb}

.overlay{position:absolute;left:0;top:0;pointer-events:none;z-index:4}
.crosshair{position:absolute;top:0;width:0;border-left:1px solid var(--ui);pointer-events:none;z-index:8;opacity:.7}
.crosshair b{position:sticky;top:6px;display:inline-block;transform:translateX(-50%);background:var(--ui);color:var(--ui-ink);font-size:11px;padding:0 5px;border-radius:3px}
.tip{position:fixed;z-index:50;background:var(--ink);color:var(--paper);font-size:12px;padding:3px 8px;border-radius:4px;pointer-events:none;white-space:nowrap}

/* side panel */
.side h2{font-size:15px;margin:0}
.sidehead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px}
.sidehead .btn{padding:3px 9px;font-size:12px;flex:none}
.side h3{font-size:13px;margin:18px 0 6px;color:var(--ink-soft);font-weight:700}
.side p,.side li{font-size:13px}
.side ul{padding-left:18px;margin:6px 0}
.fld{display:grid;grid-template-columns:76px 1fr;align-items:center;gap:6px 8px;margin-bottom:6px}
.fld label{font-size:12px;color:var(--ink-soft)}
.fld input,.fld select,.stoprow input{border:1px solid var(--line-strong);border-radius:5px;padding:4px 6px;background:var(--paper);width:100%;min-width:0}
.stoprow{display:grid;grid-template-columns:22px 1fr 64px 26px;gap:4px;align-items:center;margin-bottom:4px}
.stoprow.minor input{color:var(--ink-soft);font-size:12px}
.stoprow .k{font-size:11px;color:var(--ink-soft);text-align:center}
.stoprow .x{border:0;background:none;color:var(--ink-soft);font-size:16px;padding:0}
.stoprow .fixed{font-size:12px;color:var(--ink-soft);text-align:right;padding-right:4px}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.conn{font-size:12.5px;padding:6px 8px;border-left:3px solid var(--ui);background:var(--chrome);margin-bottom:5px;border-radius:0 4px 4px 0}
.conn.flight{border-color:var(--flight)}
.conn.ship{border-color:var(--ship)}
.conn.warn{border-color:var(--warn)}
.muted{color:var(--ink-soft)}
.swatch{display:inline-block;width:12px;height:12px;border-radius:2px;border:1px solid #555;vertical-align:-1px;margin-right:4px}
.alert{color:var(--warn);font-weight:700;font-size:13px}
kbd{font-family:inherit;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:3px;padding:0 4px;font-size:11px;background:var(--paper)}

/* menu & dialogs */
.menu{position:fixed;z-index:40;background:var(--panel);border:1px solid var(--line-strong);border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.18);padding:4px;min-width:150px}
.menu button{display:flex;align-items:center;gap:6px;width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:4px;font-size:13px}
.menu button:hover,.menu button:focus{background:var(--chrome)}
.menu .t{font-size:11px;color:var(--ink-soft);padding:4px 8px}
dialog{border:1px solid var(--line-strong);border-radius:8px;background:var(--panel);color:var(--ink);padding:16px 18px;max-width:min(760px,94vw);width:100%}
dialog::backdrop{background:rgba(10,20,30,.4)}
dialog h2{margin:0 0 10px;font-size:16px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;color:var(--ink-soft);text-align:left;font-weight:700;padding:3px 4px}
.tbl td{padding:2px 4px}
.tbl input,.tbl select{border:1px solid var(--line-strong);border-radius:4px;padding:3px 5px;background:var(--paper);width:100%;min-width:0}
.wt tr.hit td{background:color-mix(in srgb,var(--ui) 8%,transparent)}
.wt td{border-bottom:1px solid var(--line);padding:4px}
.pill{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:9px;background:var(--chrome2);margin:1px 0;white-space:nowrap}
.pill.zero{background:var(--warn);color:#fff}
.tbl input[type=color]{padding:0;height:26px;width:40px}
.tblwrap{max-height:60vh;overflow:auto}

#printHead{display:none}
@media print{
  *,*::before,*::after{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}
  :root,:root[data-theme="dark"],:root:not([data-theme="light"]){
    --paper:#FFFFFF; --chrome:#EDF0F1; --chrome2:#E2E7E9; --ink:#22313A; --ink-soft:#5B6A72;
    --line:#D5DADD; --line-strong:#8E999F; --ui:#1F3A5F; --ui-ink:#FFFFFF; --warn:#C8102E;
    --flight:#2F6FB3; --ship:#11817A; --panel:#FFFFFF;
    padding:0!important;
  }
  html,body{overflow:visible!important;height:auto!important;background:#fff!important}
  body{display:block}
  .top,.side,.crosshair,.tip,.menu,dialog{display:none!important}
  .main,.boardwrap{overflow:visible!important;display:block!important;height:auto!important}
  .boardwrap{background:#fff}
  .ruler,.lab,.corner{position:static!important}
  .run.sel{box-shadow:none}
  .run:hover{box-shadow:none}
  .run .grip{display:none}
  #printHead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:0 0 6px;font-size:12px;color:#22313A}
  #printHead h1{font-size:18px;margin:0}
  #printHead .lg{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}
  #printHead .lg span{white-space:nowrap}
  .row,.ruler{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <h1>運行ダイヤ編集ボード</h1>
  <div class="grp">
    <select class="plan" id="planSel" aria-label="案を選ぶ"></select>
    <button class="btn" id="bNew">新しい案</button>
    <button class="btn" id="bRename">名前変更</button>
    <button class="btn" id="bDelPlan">案を削除</button>
  </div>
  <span class="sep"></span>
  <div class="grp">
    <button class="btn" id="bUndo" title="元に戻す (Ctrl+Z)">元に戻す</button>
    <button class="btn" id="bRedo" title="やり直し (Ctrl+Y)">やり直し</button>
  </div>
  <span class="sep"></span>
  <div class="grp" role="group" aria-label="ドラッグの刻み">
    <button class="btn" id="bSnap1">1分刻み</button>
    <button class="btn" id="bSnap5">5分刻み</button>
  </div>
  <button class="btn" id="bConnAll">接続をすべて表示</button>
  <button class="btn" id="bWait">待ち合わせ表</button>
  <div class="zoom"><label for="zoom">拡大</label><input type="range" id="zoom" min="1" max="5" step="0.1"></div>
  <span class="sep"></span>
  <div class="grp">
    <button class="btn" id="bRoutes">路線・色</button>
    <button class="btn" id="bEvents">飛行機・船</button>
    <button class="btn" id="bRows">系統（行）</button>
  </div>
  <span class="sep"></span>
  <div class="grp">
    <button class="btn primary" id="bTT">時刻表Excel</button>
    <button class="btn" id="bCsv">Excel用CSV</button>
    <button class="btn" id="bJson">バックアップ</button>
    <button class="btn" id="bImport">読み込み</button>
    <button class="btn" id="bPrint">印刷</button>
  </div>
  <button class="btn" id="bHelp" aria-pressed="true">使い方</button>
  <span class="status" id="status">準備中…</span>
  <input type="file" id="fileIn" accept=".json,application/json" hidden>
</header>
<div id="printHead"></div>
<div class="main">
  <div class="boardwrap" id="wrap"><div class="board" id="board"></div></div>
  <aside class="side" id="side" aria-live="polite"></aside>
</div>
<div class="tip" id="tip" hidden></div>

<dialog id="dlg"></dialog>

<script>
(() => {
"use strict";
/* ============ constants & template data ============ */
const T0 = 6*60, T1 = 19*60;            // board span 6:00–19:00
const LABEL_W = 132, RULER_H = 30, EV_H = 74, ROW_H = 102, BLOCK_H = 84;
const LS_KEY = "okibus-dia-board-v1";

const DEFAULT_ROUTES = [
  {name:"空港線", color:"#FF99FF", std:58, km:23.4, kind:"定期", pat:{from:"知名",to:"空港",vias:[{n:"和泊",o:36}]}},
  {name:"国頭線", color:"#B7DEE8", std:52, km:20.7, kind:"定期", pat:{from:"知名",to:"国頭",vias:[{n:"和泊",o:36}]}},
  {name:"永嶺線", color:"#FFC000", std:64, km:28.4, kind:"定期", pat:{from:"和泊",to:"知名",vias:[{n:"新城",o:25}]}},
  {name:"後蘭線", color:"#92D050", std:59, km:26,   kind:"定期", pat:{from:"和泊",to:"知名",vias:[{n:"新城",o:28}]}},
  {name:"ガジマル線", color:"#FCE4D6", std:50, km:21.5, kind:"定期", pat:{from:"知名",to:"和泊",vias:[{n:"内城",o:23}]}},
  {name:"回送", color:"#D9D9D9", std:10, km:5.5, kind:"回送", pat:{from:"和泊",to:"国頭",vias:[]}},
  {name:"デマンド", color:"#DDEBF7", std:120, km:null, kind:"その他", pat:{from:"",to:"",vias:[]}},
  {name:"昼休憩", color:"#8DB4E2", std:60, km:null, kind:"その他", pat:{from:"",to:"",vias:[]}},
  {name:"オペレーター", color:"#E4DFEC", std:60, km:null, kind:"その他", pat:{from:"",to:"",vias:[]}},
];
const DEFAULT_TS = ["和泊","内城","ガジマル辻","知名","空港","国頭"];
const DEFAULT_ROWS = ["和泊A","知名A","C","和泊デマンド","知名デマンド","E"];
const DEFAULT_EVENTS = [
  {label:"鹿1", kind:"flight", place:"空港", s:530, e:560},
  {label:"沖縄", kind:"flight", place:"空港", s:745, e:775},
  {label:"鹿2", kind:"flight", place:"空港", s:845, e:875},
  {label:"沖縄", kind:"flight", place:"空港", s:920, e:950},
  {label:"鹿3", kind:"flight", place:"空港", s:990, e:1020},
  {label:"船下", kind:"ship", place:"和泊港", s:690, e:720},
  {label:"船上", kind:"ship", place:"和泊港", s:850, e:880},
  {label:"船上(知名)", kind:"ship", place:"知名港", s:890, e:905},
];
const m = s => { const [h,mi]=s.split(":").map(Number); return h*60+mi; };

/* ============ persistence ============ */
function setStatus(s){ $("#status").textContent = s; }
function loadLocal(){
  try{ const raw = localStorage.getItem(LS_KEY); if(raw){ const o = JSON.parse(raw); return o && typeof o==="object" ? o : null; } }catch(e){}
  return null;
}
function saveLocal(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify({plans, current:plan&&plan.id})); }catch(e){}
}
function markDirty(){
  dirty = true; setStatus("未保存の変更あり");
  clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 1200);
}
let saving = false;
async function saveNow(){
  if(!dirty || !plan) return;
  if(drag){ saveTimer = setTimeout(saveNow, 800); return; }
  if(saving){ saveTimer = setTimeout(saveNow, 600); return; }
  dirty = false; saving = true;
  plan.updatedAt = Date.now(); lastSavedAt = plan.updatedAt;
  plans[plan.id] = clone(plan);
  saveLocal();
  if(store==="db"){
    setStatus("保存中…");
    try{ await db.collection("plans").doc(plan.id).set(clone(plan)); setStatus("保存しました（共有保存）"); }
    catch(e){
      if(e && e.code==="unavailable"){ dirty = true; saveTimer=setTimeout(saveNow, 2500); setStatus("再保存を待っています"); }
      else { store="local"; setStatus("このブラウザに保存しました"); }
    }
  } else setStatus("このブラウザに保存しました");
  saving = false;
}
async function initDb(){
  if(!window.claude || !window.claude.use){ setStatus("このブラウザに保存"); return; }
  let d = null;
  try{ d = await window.claude.use("db"); }catch(e){ d=null; }
  if(!d){ setStatus("このブラウザに保存"); return; }
  db = d; store = "db";
  setStatus("共有保存に接続しました");
  db.collection("plans").onSnapshot(snapq => {
    let changedCurrent = null;
    snapq.docs.forEach(doc => {
      const data = doc.data(); if(!data || !Array.isArray(data.runs)) return;
      const p = clone(data); p.id = doc.id;
      plans[doc.id] = p;
      if(plan && doc.id===plan.id && (p.updatedAt||0) > lastSavedAt) changedCurrent = p;
    });
    // drop removed
    const ids = new Set(snapq.docs.map(d=>d.id));
    Object.keys(plans).forEach(id => { if(!ids.has(id) && plans[id].updatedAt>0 && (!plan || id!==plan.id || plan.updatedAt>0)) { if(!(plan && id===plan.id && dirty)) delete plans[id]; } });
    if(plan && !plans[plan.id]) plans[plan.id] = plan;      // unsaved working copy stays listed
    if(changedCurrent && !dirty && !drag){ plan = changedCurrent; lastSavedAt = plan.updatedAt; render(); }
    if(plan && plan.updatedAt===0 && snapq.docs.length && !dirty && !(plan._keep && !snapq.docs.some(d=>(d.data()||{}).ver===2))){
      // first visit had no saved plan, but the store has some: open the newest
      const newest = Object.values(plans).filter(p=>p.updatedAt>0).sort((a,b)=>b.updatedAt-a.updatedAt)[0];
      if(newest){ delete plans[plan.id]; plan = clone(newest); lastSavedAt = plan.updatedAt; undo=[]; redo=[]; selId=null; render(); }
    }
    fillPlanSel();
  }, err => { store="local"; setStatus("このブラウザに保存"); });
}

function pushUndo(){ undo.push(JSON.stringify(plan)); if(undo.length>120) undo.shift(); redo=[]; updUndo(); }
function doUndo(){ if(!undo.length) return; redo.push(JSON.stringify(plan)); plan = JSON.parse(undo.pop()); afterChange(); }
function doRedo(){ if(!redo.length) return; undo.push(JSON.stringify(plan)); plan = JSON.parse(redo.pop()); afterChange(); }
function updUndo(){ $("#bUndo").disabled=!undo.length; $("#bRedo").disabled=!redo.length; }
function afterChange(){ markDirty(); render(); updUndo(); }

/* ============ analysis ============ */
function clashes(){
  const set = new Set();
  plan.rows.forEach(row => {
    const rs = plan.runs.filter(r=>r.row===row).sort((a,b)=>a.dep-b.dep);
    for(let i=0;i<rs.length;i++) for(let j=i+1;j<rs.length && rs[j].dep < arr(rs[i]);j++){ set.add(rs[i].id); set.add(rs[j].id); }
  });
  return set;
}
function points(r){
  const pts = [];
  if(r.from) pts.push({n:r.from, t:r.dep, k:"発"});
  r.vias.forEach(v=>{ if(v.n && (r.vias.length<=4 || isKey(v.n))) pts.push({n:v.n, t:r.dep+Number(v.o||0), k:"経由"}); });
  if(r.to) pts.push({n:r.to, t:arr(r), k:"着"});
  return pts;
}
function connectionsFor(r, win=20){
  const out = [];
  const mine = points(r);
  plan.runs.forEach(o => {
    if(o.id===r.id || o.row===r.row) return;
    const op = points(o);
    mine.forEach(p => op.forEach(q => {
      if(p.n!==q.n) return;
      const d = q.t - p.t;
      if(Math.abs(d) <= win) out.push({p,q,o,d});
    }));
  });
  return out.sort((a,b)=>a.p.t-b.p.t || Math.abs(a.d)-Math.abs(b.d));
}
function eventLinks(r){
  const out = [];
  points(r).forEach(p => plan.events.forEach(e => {
    if(e.place !== p.n) return;
    const send = e.e - p.t;     // bus at stop → departure of plane/ship
    const meet = p.t - e.s;     // arrival of plane/ship → bus leaves stop
    if(send >= 0 && send <= 90) out.push({p,e,type:"send",d:send});
    if(meet >= 0 && meet <= 60) out.push({p,e,type:"meet",d:meet});
  }));
  return out;
}
function rowTotals(row){
  const rs = plan.runs.filter(r=>r.row===row);
  let drive=0, km=0, dead=0, s=Infinity, e=-Infinity;
  rs.forEach(r => { const rt=routeOf(r.route); const k=kmOf(r)||0;
    if(rt.kind==="定期"||rt.kind==="回送") drive += r.dur;
    if(rt.kind==="定期") km += k; if(rt.kind==="回送") dead += k;
    s=Math.min(s,r.dep); e=Math.max(e,arr(r)); });
  return {drive, km:Math.round(km*10)/10, dead:Math.round(dead*10)/10, s, e, n:rs.length};
}

function fitPpm(){
  const avail = wrap.clientWidth - LABEL_W - 16;
  return Math.max(1.8, Math.min(5, avail/(T1-T0)));
}
function render(){
  if(!plan) return;
  const W = LABEL_W + (T1-T0)*ppm;
  const clash = clashes();
  let h = `<div class="ruler" style="width:${W}px"><div class="corner" style="width:${LABEL_W}px;flex:none">時刻 →</div><div class="ticks" style="width:${(T1-T0)*ppm}px">`;
  for(let t=T0;t<=T1;t+=30){ const half = t%60!==0; if(half && ppm<1.4) continue;
    h += `<span class="tick${half?" half":""}" style="left:${X(t)}px">${half?"30":t/60}</span>`; }
  h += `</div></div>`;
  // event lane
  h += `<div class="row evlane" style="width:${W}px;height:${EV_H}px"><div class="lab" style="width:${LABEL_W}px;flex:none"><span class="nm" style="font-size:13px">飛行機・船</span><span class="tot">着〜発の時間帯</span></div><div class="track" style="width:${(T1-T0)*ppm}px">${gridBg()}`;
  const evs = plan.events.slice().sort((a,b)=>a.s-b.s);
  const lanes = [];
  evs.forEach(ev => { const x0=X(ev.s), x1=X(ev.e)+ (String(ev.label).length*12+90); let li = lanes.findIndex(end => end + 8 < x0); if(li<0){li=lanes.length;lanes.push(0);} lanes[li]=x1;
    h += `<div class="evbar ${ev.kind}" style="left:${X(ev.s)}px;width:${Math.max(6,(ev.e-ev.s)*ppm)}px;top:${4+ (li%3)*23}px" title="${esc(ev.label)} ${hm(ev.s)}着 ${hm(ev.e)}発（${esc(ev.place)}）"><span>${esc(ev.label)} ${hm(ev.s)}–${hm(ev.e)}</span></div>`; });
  h += `</div></div>`;
  // rows
  plan.rows.forEach((row,ri) => {
    const t = rowTotals(row);
    h += `<div class="row" data-row="${ri}" style="width:${W}px;height:${ROW_H}px"><div class="lab" style="width:${LABEL_W}px;flex:none"><span class="nm">${esc(row)}</span>`
      + (t.n ? `<span class="tot">運転 ${t.drive}分 / ${t.km}km${t.dead?`<br>回送 ${t.dead}km`:""}<br>${hm(t.s)}〜${hm(t.e)}</span>` : `<span class="tot">ダブルクリックで追加</span>`)
      + `</div><div class="track" data-row="${ri}" style="width:${(T1-T0)*ppm}px">${gridBg()}`;
    plan.runs.filter(r=>r.row===row).forEach(r => { h += runHtml(r, clash.has(r.id)); });
    h += `</div></div>`;
  });
  const H = RULER_H + EV_H + plan.rows.length*ROW_H + plan.rows.length + 2;
  h += `<svg class="overlay" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${overlaySvg()}</svg>`;
  h += `<div class="crosshair" id="xh" hidden style="height:${H}px"><b></b></div>`;
  board.style.width = W+"px"; board.style.height = H+"px";
  board.innerHTML = h;
  renderSide(clash);
  fillPlanSel();
  updUndo();
}
function gridBg(){
  const hour = 60*ppm, off = 0;
  const bands = plan.events.map(ev=>`<div class="band ${ev.kind}" style="left:${X(ev.s)}px;width:${Math.max(1,(ev.e-ev.s)*ppm)}px"></div>`).join("");
  return bands + `<div class="grid" style="background-image:linear-gradient(to right,var(--line-strong) 1px,transparent 1px),linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:${hour}px 100%,${hour/2}px 100%;background-position:${off}px 0,${off}px 0"></div>`;
}
function runHtml(r, isClash){
  const rt = routeOf(r.route);
  const w = Math.max(4, r.dur*ppm);
  const narrow = w < 46;
  const pts = [];
  if(r.from || r.to || r.vias.length){
    pts.push({x:0, a:"l", t:r.dep, n:r.from});
    r.vias.forEach(v => { if(shownVia(r,v)) pts.push({x:Number(v.o||0)*ppm, a:"c", t:r.dep+Number(v.o||0), n:v.n}); });
    pts.push({x:w, a:"r", t:arr(r), n:r.to});
  } else { pts.push({x:0,a:"l",t:r.dep,n:""}); pts.push({x:w,a:"r",t:arr(r),n:""}); }
  const pos = p => p.a==="l" ? `left:2px` : p.a==="r" ? `right:7px` : `left:${p.x}px;transform:translateX(-50%)`;
  let mins = "", stp = "";
  const lastX = w;
  let prevX = -99;
  pts.forEach((p,i) => {
    if(narrow && i>0 && i<pts.length-1) return;
    if(narrow && w<26 && i===pts.length-1) return;
    const px = p.a==="l" ? 8 : p.a==="r" ? w-8 : p.x;
    const isLast = i===pts.length-1;
    if(i>0 && !isLast && (px - prevX < 16 || (lastX-16) - px < 16)) return;
    prevX = px;
    mins += `<i style="${pos(p)}">${mm(p.t)}</i>`;
    if(p.n) stp += `<i style="${pos(p)}">${vtext(p.n)}</i>`;
  });
  const k = kmOf(r);
  const noStops = !r.from && !r.to && !r.vias.length;
  return `<div class="run${narrow?" narrow":""}${r.id===selId?" sel":""}${isClash?" clash":""}" data-id="${r.id}" style="left:${X(r.dep)}px;width:${w}px;height:${BLOCK_H}px;--c:${esc(rt.color)}" title="${esc(r.route)} ${hm(r.dep)}→${hm(arr(r))}">
    <div class="mins">${mins}</div>
    <div class="stp">${stp}${noStops && r.note && !narrow ? `<div class="note">${esc(r.note)}</div>`:""}</div>
    <div class="foot"><b>${esc(r.route)}</b><span>${r.dur}分${k!=null?` ${k}km`:""}</span></div>
    <div class="grip" data-grip="1" title="右端をドラッグで所要時間を変更"></div></div>`;
}
function vtext(n){
  let ch=[...String(n)];
  if(ch.length>3) ch = [ch[0],ch[1],ch[ch.length-1]];   // 4文字以上は「ガジマル辻→ガジ辻」のように縮める
  const lines=ch.map(c=>esc(c));
  return lines.join("<br>");
}
function ptXY(r, t){
  const ri = plan.rows.indexOf(r.row);
  return {x: LABEL_W + X(t), y: RULER_H + EV_H + 1 + ri*(ROW_H+1) + 9 + 15};
}
function overlaySvg(){
  let s = "";
  const top = RULER_H, H = RULER_H + EV_H + plan.rows.length*(ROW_H+1);
  const pairs = [];
  if(showAllConn){
    const seen = new Set();
    plan.runs.forEach(r => connectionsFor(r,15).forEach(c => { const key=[r.id,c.o.id,c.p.n].sort().join("|")+Math.min(c.p.t,c.q.t); if(!seen.has(key)){seen.add(key);pairs.push({r,...c});} }));
  } else if(selId){
    const r = plan.runs.find(x=>x.id===selId); if(r) connectionsFor(r).forEach(c=>pairs.push({r,...c}));
  }
  pairs.forEach(c => {
    const a = ptXY(c.r,c.p.t), b = ptXY(c.o,c.q.t);
    const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
    s += `<path d="M${a.x},${a.y} C${a.x},${my} ${b.x},${my} ${b.x},${b.y}" fill="none" stroke="var(--ui)" stroke-width="2" stroke-dasharray="5 3"/>`;
    s += `<circle cx="${a.x}" cy="${a.y}" r="4" fill="var(--ui)"/><circle cx="${b.x}" cy="${b.y}" r="4" fill="var(--ui)"/>`;
    const lbl = `${c.p.n} ${Math.abs(c.d)}分`;
    s += `<g transform="translate(${mx},${my})"><rect x="-${lbl.length*6+4}" y="-9" width="${lbl.length*12+8}" height="18" rx="9" fill="var(--ui)"/><text x="0" y="4" text-anchor="middle" font-size="11" fill="var(--ui-ink)" font-weight="700">${esc(lbl)}</text></g>`;
  });
  return s;
}

/* ============ side panel ============ */
let helpOpen = true, autoZoom = true;
try{ helpOpen = localStorage.getItem("okibus-help-open") !== "0"; }catch(e){}
function setHelp(v){ helpOpen = v; try{ localStorage.setItem("okibus-help-open", v?"1":"0"); }catch(e){} }
function syncSide(){
  const hasSel = plan.runs.some(x=>x.id===selId);
  const wasHidden = side.hidden;
  side.hidden = !(hasSel || helpOpen);
  if(wasHidden !== side.hidden && autoZoom){
    const f = Math.round(fitPpm()*10)/10;
    if(Math.abs(f-ppm)>0.05){ ppm=f; $("#zoom").value=ppm; requestAnimationFrame(render); }
  }
  const showingHelp = !side.hidden && !hasSel;
  const b = $("#bHelp"); b.classList.toggle("on", showingHelp); b.setAttribute("aria-pressed", showingHelp);
}
function renderSide(clash){
  const r = plan.runs.find(x=>x.id===selId);
  syncSide();
  if(!r){ side.innerHTML = helpHtml(clash); bindHelp(); return; }
  const rt = routeOf(r.route);
  const routeOpts = plan.routes.map(x=>`<option${x.name===r.route?" selected":""}>${esc(x.name)}</option>`).join("") + (plan.routes.some(x=>x.name===r.route)?"":`<option selected>${esc(r.route)}</option>`);
  const rowOpts = plan.rows.map(x=>`<option${x===r.row?" selected":""}>${esc(x)}</option>`).join("");
  let st = `<div class="stoprow"><span class="k">発</span><input data-f="from" value="${esc(r.from)}" placeholder="発地" aria-label="発地"><span class="fixed">${hm(r.dep)}</span><span></span></div>`;
  const hidden = r.vias.filter(v=>!shownVia(r,v)).length;
  r.vias.forEach((v,i)=>{ if(!showAllStops && !shownVia(r,v)) return; st += `<div class="stoprow${shownVia(r,v)?"":" minor"}"><span class="k">経</span><input data-v="${i}" data-vf="n" value="${esc(v.n)}" aria-label="経由地${i+1}"><input data-v="${i}" data-vf="o" type="number" min="0" value="${v.o}" title="発車から何分後" aria-label="経由地${i+1}の分後"><button class="x" data-delv="${i}" aria-label="この経由地を削除">×</button></div>`; });
  if(hidden) st += `<button class="btn" id="tglStops" style="margin:2px 0 6px 26px;font-size:12px">${showAllStops?"乗り継ぎ地点だけ表示":`途中の停留所（${hidden}か所）も表示`}</button>`;
  st += `<div class="stoprow"><span class="k">着</span><input data-f="to" value="${esc(r.to)}" placeholder="着地" aria-label="着地"><span class="fixed">${hm(arr(r))}</span><span></span></div>`;
  const conns = connectionsFor(r);
  const evl = eventLinks(r);
  let ch = "";
  evl.forEach(l => {
    ch += l.type==="send"
      ? `<div class="conn ${l.e.kind}">${esc(l.p.n)} ${hm(l.p.t)}${l.p.k==="着"?"着":"通過"} → <b>${esc(l.e.label)} ${hm(l.e.e)}発</b>まで ${l.d}分</div>`
      : `<div class="conn ${l.e.kind}"><b>${esc(l.e.label)} ${hm(l.e.s)}着</b> → ${esc(l.p.n)} ${hm(l.p.t)}発 （${l.d}分後）</div>`;
  });
  conns.forEach(c => {
    const wait = c.d;
    ch += wait>=0
      ? `<div class="conn${wait===0?" warn":""}">${esc(c.p.n)} ${hm(c.p.t)} → <b>${esc(c.o.route)}（${esc(c.o.row)}）${hm(c.q.t)}</b> 待ち${wait}分</div>`
      : `<div class="conn"><b>${esc(c.o.route)}（${esc(c.o.row)}）${hm(c.q.t)}</b> → ${esc(c.p.n)} ${hm(c.p.t)} 待ち${-wait}分</div>`;
  });
  side.innerHTML = `
    <div class="sidehead"><h2><span class="swatch" style="background:${esc(rt.color)}"></span>${esc(r.route)}　${hm(r.dep)}→${hm(arr(r))}</h2><button class="btn" id="edClose" aria-label="編集を閉じる">閉じる ×</button></div>
    ${clash.has(r.id)?`<p class="alert">同じ系統の別の運行と時間が重なっています。</p>`:""}
    <div class="fld"><label for="fRow">系統</label><select id="fRow" data-f="row">${rowOpts}</select></div>
    <div class="fld"><label for="fRoute">路線</label><select id="fRoute" data-f="route">${routeOpts}</select></div>
    <div class="fld"><label for="fDep">発時刻</label><input id="fDep" type="time" step="60" data-f="dep" value="${String(Math.floor(r.dep/60)).padStart(2,"0")}:${mm(r.dep)}"></div>
    <div class="nudge" role="group" aria-label="発時刻を動かす"><button class="btn" data-nudge="-5">−5分</button><button class="btn" data-nudge="-1">−1分</button><button class="btn" data-nudge="1">＋1分</button><button class="btn" data-nudge="5">＋5分</button></div>
    <div class="fld"><label for="fDur">所要（分）</label><input id="fDur" type="number" min="1" data-f="dur" value="${r.dur}"></div>
    <div class="fld"><label for="fKm">距離（km）</label><input id="fKm" type="number" step="0.1" min="0" data-f="km" value="${r.km??""}" placeholder="標準 ${rt.km??"－"}"></div>
    <h3>停留所（経由は発車から何分後）</h3>
    ${st}
    <div class="btnrow"><button class="btn" id="addVia">経由地を追加</button><button class="btn" id="rev">逆方向にする</button><button class="btn" id="pat">標準の停留所にする</button></div>
    <div class="fld" style="margin-top:10px"><label for="fNote">メモ</label><input id="fNote" data-f="note" value="${esc(r.note)}" placeholder="停留所がない時は図に表示"></div>
    <div class="btnrow"><button class="btn" id="dup">複製（Ctrl+D）</button><button class="btn" id="del">削除（Delete）</button><button class="btn" id="desel">選択解除（Esc）</button></div>
    <h3>接続・乗り継ぎ（前後20分以内）</h3>
    ${ch || `<p class="muted">同じ停留所で前後20分以内に出入りする他の系統の運行や、飛行機・船の時刻はありません。</p>`}
    <p class="muted" style="font-size:12px">停留所名が同じものを接続として判定します（例：「和泊」と「和泊」）。空港は飛行機、和泊港・知名港は船と照合します。</p>`;
  bindSide(r);
}
function helpHtml(clash){
  const nClash = clash.size;
  return `<div class="sidehead"><h2>使い方</h2><button class="btn" id="helpClose" aria-label="使い方を閉じる">閉じる ×</button></div>
  <ul>
    <li><b>ブロックをドラッグ</b>すると時刻が動きます。上下に動かすと別の系統へ移ります。</li>
    <li><b>右端をドラッグ</b>すると所要時間が変わります。</li>
    <li><b>何もない所をダブルクリック</b>（iPadでは<b>長押し</b>）すると、その時刻に運行を追加できます。</li>
    <li><b>クリック</b>で選ぶと、ここで停留所や時刻を細かく直せます。選んだ運行の乗り継ぎ（同じ停留所で前後20分）が点線で表示されます。</li>
    <li>選んだ状態で <kbd>←</kbd><kbd>→</kbd> で1分、<kbd>Shift</kbd>を押しながらで5分ずつ動きます（iPadでは編集パネルの「−1分」「＋5分」ボタン）。</li>
    <li>青・緑の縦の帯は飛行機・船の着〜発の時間です。</li>
    <li>この「使い方」は右上の「閉じる」で隠せます。上の「使い方」ボタンでまた開けます。運行を選ぶと編集用のパネルが開き、「閉じる」で隠れます。</li>
    <li><b>時刻表Excel</b>で、いまの案から停留所ごとの時刻表をExcelで作れます。</li>
    <li><b>待ち合わせ表</b>で、内城・ガジマル辻などを通る運行を時刻順に並べ、前後の別路線との待ち時間を一覧できます。</li>
  </ul>
  ${nClash?`<p class="alert">時間が重なっている運行が ${nClash} 件あります（赤い斜線）。</p>`:""}
  <h3>この案の集計</h3>
  ${plan.rows.map(row=>{const t=rowTotals(row);return `<div class="conn" style="border-color:var(--line-strong)"><b>${esc(row)}</b>　${t.n?`運転 ${t.drive}分（${(t.drive/60).toFixed(1)}h）／${t.km}km${t.dead?`／回送 ${t.dead}km`:""}／${hm(t.s)}〜${hm(t.e)}`:"運行なし"}</div>`;}).join("")}
  <p style="font-size:12px" class="muted">運転時間は区分「定期」「回送」、距離は「定期」を集計しています（路線・色で変更できます）。</p>
  <h3>Excelとの連携</h3>
  <p style="font-size:12px">「Excel用CSV」は、運行表Excelの「運行データ」シートと同じ列順で書き出します。開いて黄色の入力欄にそのまま貼り付けられます。</p>`;
}
function bindHelp(){ const b=$("#helpClose"); if(b) b.onclick=()=>{ setHelp(false); render(); }; }
function bindSide(r){
  side.querySelectorAll("[data-nudge]").forEach(b => b.onclick = () => { pushUndo(); r.dep=Math.max(T0,Math.min(T1-r.dur,r.dep+Number(b.dataset.nudge))); afterChange(); });
  side.querySelectorAll("[data-f]").forEach(el => el.addEventListener("change", () => {
    pushUndo();
    const f = el.dataset.f; let v = el.value;
    if(f==="dep"){ if(!v) return; const [h,mi]=v.split(":").map(Number); r.dep = h*60+mi; }
    else if(f==="dur"){ r.dur = Math.max(1, Math.round(Number(v)||1)); }
    else if(f==="km"){ r.km = v==="" ? null : Number(v); }
    else if(f==="route"){ const old=r.route; r.route=v; if(old!==v){ const rt=routeOf(v); if(rt.std) r.dur=rt.std; } }
    else r[f] = v;
    afterChange();
  }));
  side.querySelectorAll("[data-v]").forEach(el => el.addEventListener("change", () => {
    pushUndo(); const i=+el.dataset.v;
    if(el.dataset.vf==="o") r.vias[i].o = Math.max(0, Math.min(r.dur, Math.round(Number(el.value)||0)));
    else r.vias[i].n = el.value;
    r.vias.sort((a,b)=>a.o-b.o); afterChange();
  }));
  side.querySelectorAll("[data-delv]").forEach(b => b.addEventListener("click", () => { pushUndo(); r.vias.splice(+b.dataset.delv,1); afterChange(); }));
  const tg=$("#tglStops"); if(tg) tg.onclick=()=>{ showAllStops=!showAllStops; render(); };
  $("#addVia").onclick = () => { pushUndo(); r.vias.push({n:"", o:Math.round(r.dur/2)}); r.vias.sort((a,b)=>a.o-b.o); afterChange();
    setTimeout(()=>{ const ins=[...side.querySelectorAll('[data-vf="n"]')].find(i=>!i.value); ins&&ins.focus(); },0); };
  $("#rev").onclick = () => { const rt=routeOf(r.route); const pp=(rt.pats||[]).find(x=>x.from===r.to && x.to===r.from);
    if(pp){ pushUndo(); r.from=pp.from; r.to=pp.to; r.vias=clone(pp.vias); r.dur=pp.dur; afterChange(); return; }
    pushUndo(); const f=r.from; r.from=r.to; r.to=f; r.vias = r.vias.map(v=>({n:v.n,o:Math.max(0,r.dur-v.o)})).sort((a,b)=>a.o-b.o); afterChange(); };
  $("#pat").onclick = () => { const rt=routeOf(r.route);
    const pp=(rt.pats||[]).find(x=>x.from===r.from) || (rt.pats||[])[0];
    if(pp){ pushUndo(); r.from=pp.from; r.to=pp.to; r.vias=clone(pp.vias); r.dur=pp.dur; afterChange(); return; }
    pushUndo(); r.from=rt.pat.from; r.to=rt.pat.to; r.vias=clone(rt.pat.vias); if(rt.std) r.dur=rt.std; afterChange(); };
  $("#dup").onclick = duplicateSel;
  $("#del").onclick = deleteSel;
  $("#desel").onclick = () => { selId=null; render(); };
  $("#edClose").onclick = () => { selId=null; render(); };
}
function duplicateSel(){
  const r = plan.runs.find(x=>x.id===selId); if(!r) return;
  pushUndo(); const n = {...clone(r), id:uid(), dep:arr(r)+5}; plan.runs.push(n); selId=n.id; afterChange();
}
function deleteSel(){
  const i = plan.runs.findIndex(x=>x.id===selId); if(i<0) return;
  pushUndo(); plan.runs.splice(i,1); selId=null; afterChange();
}

/* ============ pointer interactions ============ */
function rowAtY(clientY){
  const tr = [...board.querySelectorAll(".track[data-row]")];
  for(const el of tr){ const b=el.getBoundingClientRect(); if(clientY>=b.top && clientY<=b.bottom) return +el.dataset.row; }
  return null;
}
function showTip(text, x, y){ tip.textContent=text; tip.hidden=false; tip.style.left=(x+14)+"px"; tip.style.top=(y+14)+"px"; }
board.addEventListener("pointerdown", e => {
  const el = e.target.closest(".run"); if(!el || e.button!==0) return;
  const r = plan.runs.find(x=>x.id===el.dataset.id); if(!r) return;
  e.preventDefault();
  drag = {r, mode: e.target.dataset.grip ? "resize" : "move", x0:e.clientX, y0:e.clientY, dep0:r.dep, dur0:r.dur, row0:r.row, moved:false, snapshot:JSON.stringify(plan)};
});
let raf = 0;
window.addEventListener("pointermove", e => {
  // crosshair
  const xh = document.getElementById("xh");
  if(xh){
    const b = board.getBoundingClientRect(); const x = e.clientX - b.left - LABEL_W;
    if(x>=0 && x <= (T1-T0)*ppm && e.clientY>=b.top && e.clientY<=b.bottom && !e.target.closest(".lab")){
      xh.hidden=false; xh.style.left=(LABEL_W+x)+"px"; xh.firstElementChild.textContent = hm(T0 + x/ppm);
    } else xh.hidden = true;
  }
  if(!drag) return;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if(!drag.moved && Math.abs(dx)<4 && Math.abs(dy)<4) return;
  drag.moved = true;
  const step = e.altKey ? 1 : snap;
  const dmin = Math.round(dx/ppm/step)*step;
  const r = drag.r;
  if(drag.mode==="move"){
    r.dep = Math.max(T0, Math.min(T1 - r.dur, drag.dep0 + dmin));
    const ri = rowAtY(e.clientY); if(ri!=null) r.row = plan.rows[ri];
    showTip(`${r.row}　${hm(r.dep)} → ${hm(arr(r))}`, e.clientX, e.clientY);
  } else {
    r.dur = Math.max(5, Math.min(T1 - r.dep, drag.dur0 + dmin));
    r.vias.forEach(v=>{ if(v.o>r.dur) v.o=r.dur; });
    showTip(`所要 ${r.dur}分（${hm(r.dep)} → ${hm(arr(r))}）`, e.clientX, e.clientY);
  }
  if(!raf) raf = requestAnimationFrame(()=>{ raf=0; selId = r.id; render(); const el=board.querySelector(`.run[data-id="${r.id}"]`); el&&el.classList.add("dragging"); });
});
window.addEventListener("pointerup", () => {
  if(!drag) return;
  const d = drag; drag = null; tip.hidden = true;
  if(d.moved){
    if(d.r.dep!==d.dep0 || d.r.dur!==d.dur0 || d.r.row!==d.row0){ undo.push(d.snapshot); if(undo.length>120) undo.shift(); redo=[]; markDirty(); }
    render();
  } else { selId = d.r.id; render(); }
});

document.addEventListener("keydown", e => {
  const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="z" && !typing){ e.preventDefault(); e.shiftKey?doRedo():doUndo(); return; }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="y" && !typing){ e.preventDefault(); doRedo(); return; }
  if(typing || $("#dlg").open) return;
  if(e.key==="Escape"){ closeMenu(); if(selId){ selId=null; render(); } return; }
  const r = plan.runs.find(x=>x.id===selId); if(!r) return;
  if(e.key==="Delete"||e.key==="Backspace"){ e.preventDefault(); deleteSel(); }
  else if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="d"){ e.preventDefault(); duplicateSel(); }
  else if(e.key==="ArrowLeft"||e.key==="ArrowRight"){ e.preventDefault(); pushUndo(); const s=(e.shiftKey?5:1)*(e.key==="ArrowLeft"?-1:1); r.dep=Math.max(T0,Math.min(T1-r.dur,r.dep+s)); afterChange(); }
  else if(e.key==="ArrowUp"||e.key==="ArrowDown"){ e.preventDefault(); const i=plan.rows.indexOf(r.row)+(e.key==="ArrowUp"?-1:1); if(i>=0&&i<plan.rows.length){ pushUndo(); r.row=plan.rows[i]; afterChange(); } }
});

/* ============ 時刻表Excel ============ */
const NK = s => String(s||"").normalize("NFKC").replace(/[\s\u3000]/g,"");
function runTimes(r){
  const m = new Map();
  const put = (n,t) => { const k=NK(n); if(k && !m.has(k)) m.set(k,t); };
  put(r.from, r.dep);
  r.vias.forEach(v => put(v.n, r.dep+Number(v.o||0)));
  put(r.to, arr(r));
  if(m.has("和泊")){ if(!m.has("和泊着")) m.set("和泊着", m.get("和泊")); if(!m.has("和泊発")) m.set("和泊発", m.get("和泊")+1); }
  return m;
}
function ttAssign(){
  const groups = TT_GROUPS.map(g => ({g, runs: plan.runs.filter(r => g.routes.includes(r.route) && NK(r[g.end])===NK(g.stop)).sort((a,b)=>a.dep-b.dep)}));
  const used = new Set(); groups.forEach(x=>x.runs.forEach(r=>used.add(r.id)));
  const left = plan.runs.filter(r => !used.has(r.id) && routeOf(r.route).kind==="定期");
  return {groups, left};
}
async function loadExcelJS(){
  if(window.ExcelJS) return window.ExcelJS;
  const srcs = ["https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js","https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"];
  for(const src of srcs){
    try{ await new Promise((res,rej)=>{ const sc=document.createElement("script"); sc.src=src; sc.onload=res; sc.onerror=rej; document.head.appendChild(sc); }); if(window.ExcelJS) return window.ExcelJS; }catch(e){}
  }
  throw new Error("ExcelJS");
}
async function buildTimetable(){
  const ExcelJS = await loadExcelJS();
  const {groups, left} = ttAssign();
  const wb = new ExcelJS.Workbook(); wb.creator = "運行ダイヤ編集ボード";
  const F = (o={}) => ({name:"ＭＳ Ｐゴシック", size:11, ...o});
  const thin = {style:"thin", color:{argb:"FF8E999F"}};
  const BOX = {top:thin,left:thin,bottom:thin,right:thin};
  const argb = c => "FF" + String(c||"#FFFFFF").replace("#","").toUpperCase().slice(0,6).padEnd(6,"F");
  const fill = c => ({type:"pattern", pattern:"solid", fgColor:{argb:argb(c)}});
  const page = {paperSize:9, orientation:"portrait", fitToPage:true, fitToWidth:1, fitToHeight:1, horizontalCentered:true,
                margins:{left:0.4,right:0.4,top:0.5,bottom:0.5,header:0.2,footer:0.2}};
  const d = new Date(); const today = `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
  const keySet = new Set(tstops().map(NK));
  const sh = [wb.addWorksheet("空港線・国頭線",{pageSetup:{...page}}), wb.addWorksheet("永嶺・後蘭・ガジマル線",{pageSetup:{...page}})];
  const titles = ["空港線、知名・国頭線　時刻表（案）","永嶺線・後蘭線・ガジマル線　時刻表（案）"];
  sh.forEach((ws,i) => {
    ws.getCell(1,1).value = titles[i]; ws.getCell(1,1).font = F({size:16,bold:true});
    ws.getCell(2,1).value = `案：${plan.name}　　作成日：${today}　　（運行ダイヤ編集ボードから自動作成）`; ws.getCell(2,1).font = F({size:9,color:{argb:"FF5B6A72"}});
  });
  const G = k => groups.find(x=>x.g.key===k);
  function block(ws, gx, row, col){
    const {g, runs} = gx; const n = Math.max(1, runs.length);
    ws.mergeCells(row, col, row, col+n);
    const lc = ws.getCell(row, col); lc.value = g.label; lc.font = F({size:12,bold:true,color:{argb:"FFFFFFFF"}}); lc.fill = fill("#1F3A5F"); lc.alignment={vertical:"middle"};
    ws.getRow(row).height = 20;
    const h1 = row+1, h2 = row+2, h3 = row+3;
    [["路線",h1],["行先",h2],["系統",h3]].forEach(([t,rr]) => { const c=ws.getCell(rr,col); c.value=t; c.font=F({bold:true,size:10}); c.border=BOX; c.alignment={horizontal:"center"}; c.fill=fill("#EDF0F1"); });
    if(!runs.length){ const c=ws.getCell(h1,col+1); c.value="（運行なし）"; c.font=F({size:10}); }
    runs.forEach((r,j) => {
      const cc = col+1+j, rt = routeOf(r.route);
      const a = ws.getCell(h1,cc); a.value=r.route; a.font=F({bold:true,size:10}); a.fill=fill(rt.color); a.border=BOX; a.alignment={horizontal:"center",vertical:"middle",wrapText:true,shrinkToFit:true};
      const b = ws.getCell(h2,cc); b.value=(r.to||"")+"行"; b.font=F({size:10}); b.fill=fill(rt.color); b.border=BOX; b.alignment={horizontal:"center",shrinkToFit:true};
      const c = ws.getCell(h3,cc); c.value=r.row; c.font=F({size:8,color:{argb:"FF5B6A72"}}); c.border=BOX; c.alignment={horizontal:"center",shrinkToFit:true};
    });
    const times = runs.map(runTimes);
    g.stops.forEach((name,k) => {
      const rr = row+4+k, key = keySet.has(NK(name)) || keySet.has(NK(name).replace(/[着発]$/,""));
      const nc = ws.getCell(rr,col); nc.value=name; nc.font=F({bold:key}); nc.border=BOX; if(key) nc.fill=fill("#FFF2CC");
      runs.forEach((r,j) => {
        const c = ws.getCell(rr, col+1+j), t = times[j].get(NK(name));
        if(t==null){ c.value="-"; c.alignment={horizontal:"center"}; c.font=F({color:{argb:"FF8E999F"}}); }
        else { c.value = t/1440; c.numFmt="h:mm"; c.alignment={horizontal:"center"}; c.font=F({bold:k===0||k===g.stops.length-1||key}); }
        c.border=BOX; if(key) c.fill=fill("#FFF2CC");
      });
    });
    return row + 4 + g.stops.length;
  }
  // 1枚目
  const ws0 = sh[0];
  let end = block(ws0, G("AK_out"), 4, 1);
  end = block(ws0, G("AK_in"), end+2, 1);
  ws0.getColumn(1).width = 16;
  for(let c=2;c<=1+Math.max(G("AK_out").runs.length,G("AK_in").runs.length,1);c++) ws0.getColumn(c).width = 7.5;
  // 2枚目（左：永嶺・後蘭、右：ガジマル）
  const ws1 = sh[1];
  const nEG = Math.max(G("EG_W").runs.length, G("EG_C").runs.length, 1);
  const gjCol = 1 + nEG + 2;
  const e1 = Math.max(block(ws1, G("EG_W"), 4, 1), block(ws1, G("GJ_W"), 4, gjCol));
  const e2 = Math.max(block(ws1, G("EG_C"), e1+2, 1), block(ws1, G("GJ_C"), e1+2, gjCol));
  ws1.getColumn(1).width = 14; ws1.getColumn(gjCol).width = 14;
  for(let c=2;c<=1+nEG;c++) ws1.getColumn(c).width = 7.5;
  ws1.getColumn(1+nEG+1).width = 2;
  for(let c=gjCol+1;c<=gjCol+Math.max(G("GJ_W").runs.length,G("GJ_C").runs.length,1);c++) ws1.getColumn(c).width = 7.5;
  const foot = ws1.getCell(e2+2,1); foot.value = "お問い合わせ先：0997-93-2054（沖永良部バス企業団　知名営業所）　デマンド受付：0997-93-2400（午後運行）"; foot.font = F({size:10});
  // 3枚目：系統別一覧
  const ws2 = wb.addWorksheet("系統別一覧",{pageSetup:{...page, orientation:"landscape", fitToHeight:0}});
  ws2.getCell(1,1).value = "系統別 運行一覧（案）"; ws2.getCell(1,1).font = F({size:14,bold:true});
  ws2.getCell(2,1).value = `案：${plan.name}　　作成日：${today}`; ws2.getCell(2,1).font = F({size:9,color:{argb:"FF5B6A72"}});
  const hd = ["系統","路線","発地","発時刻","着地","着時刻","所要(分)","距離(km)","メモ"];
  hd.forEach((t,i)=>{ const c=ws2.getCell(4,i+1); c.value=t; c.font=F({bold:true,color:{argb:"FFFFFFFF"}}); c.fill=fill("#1F3A5F"); c.border=BOX; c.alignment={horizontal:"center"}; });
  let rr = 5;
  plan.rows.forEach(row => {
    plan.runs.filter(r=>r.row===row).sort((a,b)=>a.dep-b.dep).forEach(r => {
      const vals = [row, r.route, r.from||"", r.dep/1440, r.to||"", arr(r)/1440, r.dur, kmOf(r), r.note||""];
      vals.forEach((v,i)=>{ const c=ws2.getCell(rr,i+1); c.value=(v==null?"":v); c.font=F(); c.border=BOX; if(i===3||i===5){ c.numFmt="h:mm"; c.alignment={horizontal:"center"}; } if(i===1) c.fill=fill(routeOf(r.route).color); });
      rr++;
    });
  });
  [12,12,10,8,10,8,9,9,40].forEach((w,i)=>ws2.getColumn(i+1).width=w);
  ws2.views = [{state:"frozen", ySplit:4}];
  // 時刻表に載らない定期運行
  if(left.length){
    const ws3 = wb.addWorksheet("時刻表に載らない運行");
    ws3.getCell(1,1).value = "次の運行は、時刻表のどの表にも当てはまらなかったため載せていません（路線名と発地・着地を確認してください）。"; ws3.getCell(1,1).font=F({bold:true,color:{argb:"FFC8102E"}});
    left.forEach((r,i)=>{ [r.row, r.route, r.from, hm(r.dep), r.to, hm(arr(r))].forEach((v,j)=>{ ws3.getCell(3+i,j+1).value=v; }); });
    [12,12,10,8,10,8].forEach((w,i)=>ws3.getColumn(i+1).width=w);
  }
  return {buf: await wb.xlsx.writeBuffer(), groups, left};
}
$("#bTT").onclick = () => {
  const {groups, left} = ttAssign();
  const lines = groups.map(x=>`<li>${esc(x.g.label)}：<b>${x.runs.length}便</b></li>`).join("");
  openDialog(`<h2>時刻表Excelを作成</h2>
    <p style="font-size:13px">いま開いている案「${esc(plan.name)}」から、停留所ごとの時刻表をExcelで作ります。ブロックを動かした分だけ、途中の停留所の時刻も自動で計算されます。</p>
    <ul style="font-size:13px;margin:6px 0 10px">${lines}</ul>
    ${left.length?`<p class="alert">時刻表のどの表にも当てはまらない定期運行が ${left.length} 便あります（Excelの最後のシートに一覧を入れます）。</p>`:""}
    <p class="muted" style="font-size:12px">シート：空港線・国頭線／永嶺・後蘭・ガジマル線／系統別一覧。乗り継ぎを調べる停留所（${esc(tstops().join("・"))}）の行は黄色で強調します。</p>
    <div class="btnrow"><button class="btn primary" id="ttOk">作成してダウンロード</button><button class="btn" data-close>やめる</button></div>`);
  $("#ttOk").onclick = async () => {
    const b = $("#ttOk"); b.disabled = true; b.textContent = "作成中…";
    try{
      const {buf} = await buildTimetable();
      closeDialog();
      await offerFile(`${plan.name}_時刻表.xlsx`, new Uint8Array(buf));
    }catch(e){
      b.disabled=false; b.textContent="作成してダウンロード";
      setStatus(e && e.message==="ExcelJS" ? "Excel作成の部品を読み込めませんでした（インターネット接続を確認してください）" : "時刻表を作成できませんでした");
    }
  };
};

/* ============ export / import / print ============ */
async function offerFile(filename, data){
  let dl = null;
  try{ dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; }catch(e){}
  if(!dl){
    // 通常のブラウザ（Chrome・Edgeなど）で直接開いた場合
    try{
      const type = filename.endsWith(".csv") ? "text/csv;charset=utf-8" : filename.endsWith(".xlsx") ? "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" : "application/json";
      const url = URL.createObjectURL(new Blob([data], {type}));
      const a = document.createElement("a"); a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 2000);
      setStatus("書き出しました");
    }catch(e){ setStatus("書き出しできませんでした"); }
    return;
  }
  try{ await dl.save({filename, data}); setStatus("書き出しました"); }
  catch(e){ if(e && e.code==="declined") setStatus("書き出しをやめました"); else if(e && e.code==="rate_limited") setStatus("少し待ってからもう一度押してください"); else setStatus("書き出しできませんでした"); }
}
$("#bCsv").onclick = () => {
  const q = v => { v = v==null ? "" : String(v); return /[",\n]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v; };
  const head = ["No","系統","路線名","発時刻","発地","経由1","分後","経由2","分後","経由3","分後","経由4","分後","着地","所要分","距離km","備考","着時刻"];
  const runs = plan.runs.slice().sort((a,b)=>plan.rows.indexOf(a.row)-plan.rows.indexOf(b.row) || a.dep-b.dep);
  const lines = [head.join(",")];
  runs.forEach((r,i) => {
    const v = [i+1, r.row, r.route, hm(r.dep), r.from];
    const sv = r.vias.filter(x=>shownVia(r,x));
    for(let k=0;k<4;k++){ const x=sv[k]; v.push(x?x.n:"", x?x.o:""); }
    v.push(r.to, r.dur, r.km??"", r.note, hm(arr(r)));
    if(sv.length>4) v[16] = (v[16]?v[16]+" ":"") + "※経由5以降: " + sv.slice(4).map(x=>x.n+"+"+x.o).join(" ");
    lines.push(v.map(q).join(","));
  });
  offerFile(`${plan.name}_運行データ.csv`, "\uFEFF" + lines.join("\r\n"));
};
$("#bJson").onclick = () => offerFile(`${plan.name}_バックアップ.json`, JSON.stringify(plan, null, 1));
$("#bImport").onclick = () => $("#fileIn").click();
$("#fileIn").addEventListener("change", async e => {
  const f = e.target.files[0]; if(!f) return;
  try{
    const o = JSON.parse(await f.text());
    if(!o || !Array.isArray(o.runs)) throw 0;
    const p = makePlan((o.name||"読み込んだ案")+"（読込）", o);
    p.runs = o.runs.map(r=>({id:uid(), row:String(r.row||""), route:String(r.route||""), dep:Number(r.dep)||T0, dur:Math.max(1,Number(r.dur)||60), km:r.km==null||r.km===""?null:Number(r.km), from:String(r.from||""), to:String(r.to||""), vias:Array.isArray(r.vias)?r.vias.map(v=>({n:String(v.n||""),o:Number(v.o)||0})):[], note:String(r.note||"")}));
    plans[p.id]=p; plan=clone(p); selId=null; undo=[]; redo=[]; markDirty(); render(); setStatus("読み込みました");
  }catch(err){ setStatus("このファイルは読み込めません（バックアップのJSONを選んでください）"); }
  e.target.value = "";
});
let printPaper = "A3", printConn = false;
$("#bPrint").onclick = () => {
  openDialog(`<h2>カラーで印刷</h2>
    <div class="fld"><label for="pPaper">用紙</label><select id="pPaper"><option value="A3"${printPaper==="A3"?" selected":""}>A3 横（おすすめ）</option><option value="A4"${printPaper==="A4"?" selected":""}>A4 横</option></select></div>
    <div class="fld"><label for="pConn">乗り継ぎ線</label><select id="pConn"><option value="0">印刷しない</option><option value="1"${printConn?" selected":""}>すべて印刷する</option></select></div>
    <p class="muted" style="font-size:12px">運行表は1枚に収まるように縮小されます。印刷画面でプリンターの用紙サイズを同じものに合わせてください。色が出ないときは、印刷画面の「詳細設定」で「背景のグラフィック」にチェックを入れてください。</p>
    <div class="btnrow"><button class="btn primary" id="pOk">印刷する</button><button class="btn" data-close>やめる</button></div>`);
  $("#pOk").onclick = () => { printPaper=$("#pPaper").value; printConn=$("#pConn").value==="1"; closeDialog(); setTimeout(doPrint, 80); };
};
function doPrint(){
  const prevPpm=ppm, prevSel=selId, prevConn=showAllConn;
  selId=null; showAllConn=printConn; ppm=1.8; render();
  // 見出しと凡例
  const used = [...new Set(plan.runs.map(r=>r.route))];
  const d=new Date();
  $("#printHead").innerHTML = `<h1>${esc(plan.name)}</h1><span>印刷日 ${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}</span>`
    + `<span class="lg">${used.map(n=>`<span><span class="swatch" style="background:${esc(routeOf(n).color)}"></span>${esc(n)}</span>`).join("")}`
    + `<span><span class="swatch" style="background:var(--flight)"></span>飛行機</span><span><span class="swatch" style="background:var(--ship)"></span>船</span></span>`;
  // 用紙に合わせて縮小（余白8mm、96dpi換算）
  const mmPx = 96/25.4;
  const pw = (printPaper==="A3" ? 420 : 297) - 16, ph = (printPaper==="A3" ? 297 : 210) - 16;
  const bw = board.offsetWidth, bh = board.offsetHeight + 40;
  const scale = Math.min(1, (pw*mmPx)/bw, (ph*mmPx)/bh);
  let st = document.getElementById("printStyle");
  if(!st){ st=document.createElement("style"); st.id="printStyle"; document.head.appendChild(st); }
  st.textContent = `@media print{@page{size:${printPaper} landscape;margin:8mm} #printHead{width:${bw}px;zoom:${scale}} .board{zoom:${scale}}}`;
  const restore = () => { ppm=prevPpm; selId=prevSel; showAllConn=prevConn; render(); window.removeEventListener("afterprint", restore); };
  window.addEventListener("afterprint", restore);
  try{ window.print(); }catch(e){ setStatus("この画面では印刷を開けません。ブラウザ版で開いて印刷してください"); restore(); }
}

/* ============ toolbar wiring ============ */
function setSnap(v){ snap=v; $("#bSnap1").classList.toggle("on",v===1); $("#bSnap5").classList.toggle("on",v===5); $("#bSnap1").setAttribute("aria-pressed",v===1); $("#bSnap5").setAttribute("aria-pressed",v===5); }
$("#bSnap1").onclick=()=>setSnap(1); $("#bSnap5").onclick=()=>setSnap(5);
$("#bConnAll").onclick=()=>{ showAllConn=!showAllConn; $("#bConnAll").classList.toggle("on",showAllConn); $("#bConnAll").setAttribute("aria-pressed",showAllConn); render(); };
$("#bHelp").onclick=()=>{
  const showingHelp = !side.hidden && !plan.runs.some(x=>x.id===selId);
  if(showingHelp){ setHelp(false); } else { selId=null; setHelp(true); }
  render();
};
$("#bUndo").onclick=doUndo; $("#bRedo").onclick=doRedo;
$("#zoom").addEventListener("input", e => { autoZoom = false; ppm = Number(e.target.value); render(); });
let rT; window.addEventListener("resize", () => { clearTimeout(rT); rT=setTimeout(()=>{ if(Math.abs(ppm-fitPpm())<.05 || ppm>fitPpm()+.01){} render(); },150); });

/* ============ boot ============ */
(function boot(){
  const loc = loadLocal();
  if(loc && loc.plans && Object.keys(loc.plans).length){
    plans = loc.plans;
    plan = clone(plans[loc.current] || Object.values(plans)[0]);
    if(!Object.values(plans).some(x=>x.ver===2)){
      plan = makePlan("案（R8.3.1時刻表・全停留所）","r8"); plan._keep = true; plans[plan.id] = plan;
    }
  } else {
    plan = makePlan("案1（R8.3.1から）","r8"); plan._keep = true;
    plans[plan.id] = plan;
  }
  lastSavedAt = plan.updatedAt||0;
  ppm = Math.round(fitPpm()*10)/10; $("#zoom").value = ppm;
  $("#zoom").min = 1;
  setSnap(5);
  render();
  initDb();
})();
})();
